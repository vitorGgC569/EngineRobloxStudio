[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-quality-engine"
version = "0.1.0"
description = "Deterministic quality auditing and release gates for Roblox games."
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0"]

[project.scripts]
rqe = "rqe.cli:main"

[tool.rqe]
contract = "contracts/mining-tycoon.robloxqa.json"
